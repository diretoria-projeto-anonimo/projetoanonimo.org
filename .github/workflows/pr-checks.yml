name: PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Os dois últimos são os guardas da Biblioteca Viva. Sem eles a suíte fica
      # verde mesmo se a proteção do PA-BRD-001 sumir do artefato: foi o que
      # aconteceu até 09/10/2026 — `biblioteca-build-reprodutivel` confere que as
      # fontes reproduzem o Code.gs versionado e que ele preserva as sete marcas de
      # produção; `biblioteca-contrato-frontend-sync` impede que a cópia do
      # frontend volte a divergir do contrato canônico.
      - name: Run repository tests
        run: node --test tests/frontend-contract.test.cjs tests/apps-script.test.cjs tests/inbound-funnel.test.cjs tests/inbound-e2e.test.cjs tests/inbound-preview.test.cjs tests/biblioteca-contrato-sync.test.cjs tests/biblioteca-contrato.test.cjs tests/biblioteca-api-referencia.test.cjs tests/apps-script-editorial-guard.test.cjs tests/conteudo-publico-sem-vazamento.test.cjs tests/funil-cta-publicado.test.cjs tests/brand-identity.test.cjs tests/biblioteca-build-reprodutivel.test.cjs tests/biblioteca-contrato-frontend-sync.test.cjs
